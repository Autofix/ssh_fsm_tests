[package]
name = "stamp"
version = "0.1.0"
edition = "2024"

[dependencies]
cfg-if = "1.0.0"
ed25519-dalek = { version = "2", default-features = false }
embassy-executor = { version = "0.7"}
embassy-futures = "0.1"
embedded-io-async = "0.6"
esp-hal = { version = "=1.0.0-beta.1", features = [ "unstable", "esp32c6" ] }
esp-hal-embassy = { version = "0.8", features = [ "esp32c6"] }
esp-wifi = { version = "0.14.0", features = ["wifi", "esp-alloc",  "esp32c6"] }
embassy-net = { version = "0.7", features = ["tcp", "udp", "dhcpv4", "medium-ethernet"] }
embassy-time = { version = "0.4" }
static_cell = "2.1.1"
embassy-sync = "0.7.0"
getrandom = { version = "0.2.10", features = ["custom"] }
heapless = { version = "0.8", features = []}
sunset = { git = "https://github.com/mkj/sunset", rev = "5ff44bb", default-features = false, features = ["openssh-key", "embedded-io"]}
sunset-async = { git = "https://github.com/mkj/sunset", rev = "5ff44bb", default-features = false, features = ["multi-thread"]}
sunset-sshwire-derive = { git = "https://github.com/mkj/sunset", rev = "5ff44bb", default-features = false }
log = { version = "0.4" }
esp-storage = { version = "0.6", features = [ "esp32c6" ]  }
embedded-storage = "0.3.1"
esp-println = { version = "0.14", features = ["log-04"]}
portable-atomic = "1"
edge-dhcp = "0.6"
edge-nal = "0.5"
edge-nal-embassy = "0.6"
bcrypt = { version = "0.17", default-features = false }
subtle = { version = "2", default-features = false }
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
digest = { version = "0.10", default-features = false, features = ["rand_core", "subtle"] }
esp-bootloader-esp-idf = "0.1"
snafu = { version = "0.8.6", default-features = false }
paste = "1"
pretty-hex = { version = "0.4", default-features = false }



[features]
esp32 = []
ipv6 = []
esp32s2 = []
esp32s3 = []
